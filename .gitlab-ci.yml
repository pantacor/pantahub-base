stages:
    - security
    - build
    - deploy

image: docker:27.3.1-cli # Use a modern client

security-scan:
    stage: security
    # Builds and runs Dockerfile.security-scan instead of naming a golang image
    # here, so the Go release used by the scan is defined in one place and
    # cannot drift from the one the application is built with. It also makes
    # security_check.sh an exact local reproduction of this job.
    script:
        # Create the artifact up front: if anything below fails before the scan
        # produces one, the job still has a file to upload instead of erroring
        # a second time on a missing artifact.
        - touch gosec.sarif
        - docker build -f Dockerfile.security-scan -t pantahub-base-security-scan .
        - scan_status=0
        # Addressed by id rather than by name. The docker-in-docker daemon keeps
        # its state between pipelines, so a fixed --name collides with the
        # container the previous run left behind.
        - scan_container=$(docker create pantahub-base-security-scan)
        - docker start --attach "$scan_container" || scan_status=$?
        # Keep the SAST artifact uploadable whether or not the scan passed.
        - docker cp "$scan_container:/src/gosec.sarif" gosec.sarif || true
        - docker rm -f "$scan_container" > /dev/null || true
        - exit "$scan_status"
    artifacts:
        reports:
            sast: gosec.sarif
        when: always

services:
    - name: docker:27.3.1-dind # Use a matching server
      alias: docker

variables:
    CONTAINER_IMAGE: registry.gitlab.com/$CI_PROJECT_PATH
    DOCKER_DRIVER: overlay2
    GIT_SUBMODULE_STRATEGY: recursive
    DOCKER_TLS_CERTDIR: ""

build-branch:
    stage: build
    before_script:
        - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
        - docker run --rm --privileged multiarch/qemu-user-static:register || true
    script:
        - docker pull $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG || true
        - docker build -f Dockerfile --build-arg NS=branch --cache-from $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG --tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA --tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG .
        - test -n "$CI_BUILD_TAG" && docker tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA $CONTAINER_IMAGE:$CI_BUILD_TAG || true
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG
        - test -n "$CI_BUILD_TAG" && docker push $CONTAINER_IMAGE:$CI_BUILD_TAG || true
    except:
        - develop
        - master
        - tags

build-devel:
    stage: build
    before_script:
        - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
        - docker run --rm --privileged multiarch/qemu-user-static:register || true
    script:
        - docker pull $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG || true
        - docker build -f Dockerfile --build-arg NS=api2 --cache-from $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG --tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA --tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG .
        - test -n "$CI_BUILD_TAG" && docker tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA $CONTAINER_IMAGE:$CI_BUILD_TAG || true
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG
        - test -n "$CI_BUILD_TAG" && docker push $CONTAINER_IMAGE:$CI_BUILD_TAG || true
    only:
        - develop

build-master:
    stage: build
    before_script:
        - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
        - docker run --rm --privileged multiarch/qemu-user-static:register || true
    script:
        - docker pull $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG || true
        - docker build -f Dockerfile --build-arg NS=api --cache-from $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG --tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA --tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG .
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG
        - test -n "$CI_BUILD_TAG" && docker push $CONTAINER_IMAGE:$CI_BUILD_TAG || true
    only:
        - master

build-tags:
    stage: build
    before_script:
        - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
        - docker run --rm --privileged multiarch/qemu-user-static:register || true
    script:
        - docker pull $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG || true
        - docker build -f Dockerfile --build-arg NS=master --cache-from $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG --tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA --tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG .
        - docker tag $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA $CONTAINER_IMAGE:$CI_COMMIT_TAG
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_TAG
    only:
        - tags

deploy-devel:
    stage: deploy
    image: alpine:3.7
    script:
        - apk update  && apk add --no-cache curl
        - curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
        - chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
        - mkdir -p $HOME/.kube
        - echo -n $KUBE_CONFIG_DEV | base64 -d > $HOME/.kube/config
        - kubectl set image deploy/pv-pantahub-base pantahub-base=$CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    # develop only: KUBE_CONFIG_DEV is a protected variable and only master and
    # develop are protected branches, so on a feature branch it is not injected,
    # the kubeconfig written above is empty, and kubectl falls back to
    # localhost:8080 and fails. Feature branches still build and push an image
    # (build-branch), so deploying one is a manual kubectl set image away.
    only:
        - develop

deploy-prod:
    stage: deploy
    image: alpine:3.7
    script:
        - apk update  && apk add --no-cache curl
        - curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
        - chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
        - mkdir -p $HOME/.kube
        - echo -n $KUBE_CONFIG_PROD | base64 -d > $HOME/.kube/config
        - kubectl set image deploy/pv-prod-pantahub-base pantahub-base=$CONTAINER_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    only:
        - tags
