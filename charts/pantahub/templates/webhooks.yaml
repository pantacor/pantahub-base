{{- if .Values.webhooks.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: webhooks
  labels:
    {{- include "pantahub.labels" (dict "ctx" . "name" "webhooks") | nindent 4 }}
spec:
  type: {{ .Values.webhooks.service.type }}
  ports:
    - name: http
      port: 12380
      targetPort: 12380
  selector:
    {{- include "pantahub.selectorLabels" (dict "ctx" . "name" "webhooks") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhooks
  labels:
    {{- include "pantahub.labels" (dict "ctx" . "name" "webhooks") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pantahub.selectorLabels" (dict "ctx" . "name" "webhooks") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pantahub.labels" (dict "ctx" . "name" "webhooks") | nindent 8 }}
      annotations:
        checksum/webhooks-env: {{ include "pantahub.webhooksEnv" . | sha256sum }}
    spec:
      enableServiceLinks: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              {{- if .Values.mongo.enabled }}
              until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done
              {{- end }}
              {{- if .Values.kafka.enabled }}
              until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done
              {{- end }}
              true
      containers:
        - name: webhooks
          image: "{{ .Values.webhooks.image }}:{{ .Values.webhooks.tag }}"
          env:
            {{- include "pantahub.webhooksEnv" . | nindent 12 }}
          ports:
            - containerPort: 12380
          livenessProbe:
            httpGet:
              path: /healthz
              port: 12380
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 12380
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.webhooks.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
