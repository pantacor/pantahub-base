{{- if .Values.base.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: base
  labels:
    {{- include "pantahub.labels" (dict "ctx" . "name" "base") | nindent 4 }}
spec:
  type: {{ .Values.base.service.type }}
  ports:
    - name: api
      port: 12365
      targetPort: 12365
    - name: api-tls
      port: 12366
      targetPort: 12366
  selector:
    {{- include "pantahub.selectorLabels" (dict "ctx" . "name" "base") | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-s3
  labels:
    {{- include "pantahub.labels" (dict "ctx" . "name" "base") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.global.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.base.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: base
  labels:
    {{- include "pantahub.labels" (dict "ctx" . "name" "base") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pantahub.selectorLabels" (dict "ctx" . "name" "base") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pantahub.labels" (dict "ctx" . "name" "base") | nindent 8 }}
      annotations:
        checksum/env: {{ include "pantahub.effectiveEnv" . | sha256sum }}
    spec:
      enableServiceLinks: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # base blocks on fluentd and mongo at startup; wait for them instead of
      # crash-looping through the first minutes of cluster bring-up
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            # only wait for deps this release actually runs — a disabled
            # (external) dep has no Service here and would block forever
            - |
              {{- if .Values.mongo.enabled }}
              until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done
              {{- end }}
              {{- if .Values.fluentd.enabled }}
              until nc -z fluentd 24224; do echo waiting for fluentd; sleep 2; done
              {{- end }}
              {{- if .Values.elasticsearch.enabled }}
              until nc -z elasticsearch 9200; do echo waiting for elasticsearch; sleep 2; done
              {{- end }}
              true
      containers:
        - name: base
          image: "{{ .Values.base.image }}:{{ .Values.base.tag }}"
          envFrom:
            - configMapRef:
                name: pantahub-env
          env:
            {{- include "pantahub.envMap" .Values.base.env | nindent 12 }}
          ports:
            - containerPort: 12365
            - containerPort: 12366
          readinessProbe:
            tcpSocket:
              port: 12365
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: local-s3
              mountPath: /local-s3
          {{- with .Values.base.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: local-s3
          persistentVolumeClaim:
            claimName: local-s3
{{- end }}
