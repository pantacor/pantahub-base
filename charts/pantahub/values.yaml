# Kubernetes translation of docker-compose.yml.
#
# Service names are FIXED (mongo, kafka, fluentd, ...) because the entrypoint
# scripts, connector configs and env defaults address services by those
# hostnames, exactly like docker-compose does. Install at most one release per
# namespace.

global:
  # storageClass for all PVCs ("" = cluster default)
  storageClass: ""
  # all default images are public, so no pull secrets are needed; this knob
  # exists for private mirrors, e.g. imagePullSecrets: [{name: my-regcred}]
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# Shared pantahub environment (ConfigMap "pantahub-env"), consumed by base,
# gc and the cronjobs. Mirrors env.default; override per deployment in a
# values file (equivalent of .env.local).
#
# The JWT/JWE keys below are the well-known dev/testing keys from env.default.
# REPLACE THEM for anything but a throwaway dev cluster.
# ---------------------------------------------------------------------------
env:
  PANTAHUB_DISABLE_SIGN_UP: "false"
  PANTAHUB_DISABLE_FORGOT_PASSWORD: "false"
  PANTAHUB_DISABLE_EMAIL_PASSWORD_LOGIN: "false"
  PANTAHUB_SCRYPT_SECRET: "ADD YOUR SECRET HERE"
  # SECURITY: replace the JWT/JWE keys below with a fresh RSA keypair per
  # deployment (via a values override or a k8s Secret). The committed values
  # were throwaway test keys and MUST NOT be used in any real deployment.
  PANTAHUB_JWT_SECRET: "REPLACE_ME__base64_RSA_private_key__generate_per_deployment"
  PANTAHUB_JWT_PUB: "REPLACE_ME__base64_RSA_public_key__matching_the_private_key"
  PANTAHUB_JWE_SECRET: "REPLACE_ME__base64_RSA_private_key__generate_per_deployment"
  PANTAHUB_JWE_PUB: "REPLACE_ME__base64_RSA_public_key__matching_the_private_key"
  PANTAHUB_USE_CAPTCHA: "false"
  GOOGLE_CAPTCHA_SECRET: ""
  GOOGLE_OAUTH_CLIENT_ID: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  GITHUB_OAUTH_CLIENT_ID: ""
  GITHUB_OAUTH_CLIENT_SECRET: ""
  GITLAB_OAUTH_CLIENT_ID: ""
  GITLAB_OAUTH_CLIENT_SECRET: ""
  ENTRAID_OAUTH_CLIENT_ID: ""
  ENTRAID_OAUTH_CLIENT_SECRET: ""
  PANTAHUB_AUTH_ALLOWED_DOMAINS: ""
  PANTAHUB_DEMOACCOUNTS_PASSWORD_admin: ""
  PANTAHUB_DEMOACCOUNTS_PASSWORD_user1: ""
  PANTAHUB_DEMOACCOUNTS_PASSWORD_user2: ""
  PANTAHUB_DEMOACCOUNTS_PASSWORD_user3: ""
  PANTAHUB_DEMOACCOUNTS_PASSWORD_device1: ""
  PANTAHUB_DEMOACCOUNTS_PASSWORD_service1: ""
  PANTAHUB_HOST: "api.pantahub.com"
  PANTAHUB_PORT: ""
  PANTAHUB_SCHEME: "https"
  PANTAHUB_HOST_WWW: "www.pantahub.com"
  PANTAHUB_STORAGE_DRIVER: "local"
  PANTAHUB_STORAGE_PATH: "/"
  PANTAHUB_S3PATH: "../local-s3"
  PANTAHUB_S3_USE_ANONYMOUS_CREDENTIALS: "false"
  PANTAHUB_S3_ACCESS_KEY_ID: "foo"
  PANTAHUB_S3_SECRET_ACCESS_KEY: "foo"
  PANTAHUB_S3_REGION: "us-east-1"
  PANTAHUB_S3_BUCKET: "testing"
  PANTAHUB_S3_ENDPOINT: "http://localstack:4566"
  MAILGUN_DOMAIN: ""
  MAILGUN_APIKEY: ""
  MAILGUN_PUBAPIKEY: ""
  PANTAHUB_PRODUCTNAME: "pantahub-community"
  ELASTIC_URL: "http://elasticsearch:9200"
  PANTAHUB_ELASTIC_SHARDS: "5"
  PANTAHUB_ELASTIC_REPLICAS: "1"
  FLUENT_HOST: "fluentd"
  FLUENT_PORT: "24224"
  MONGO_HOST: "mongo"
  MONGO_PORT: "27017"
  MONGO_DB: "pantabase-serv"
  # MONGO_USER / MONGO_PASS are injected from mongo.appUser (the single
  # credential source, kept next to the user bootstrap in the mongo section)
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  PH_AUTH: "https://api.pantahub.com/auth"
  PANTAHUB_SA_ADMIN_SECRET: ""
  PANTAHUB_GC_API: "http://gc:2000"
  PANTAHUB_GC_REMOVE_GARBAGE: "true"
  PANTAHUB_GC_UNCLAIMED_EXPIRY: "P5D"
  PANTAHUB_GC_GARBAGE_EXPIRY: "P2D"
  PANTAHUB_WEBHOOKS_PROXY_TRUST_INSECURE: "true"

# ---------------------------------------------------------------------------
# Services (one block per docker-compose service)
# ---------------------------------------------------------------------------

base:
  enabled: true
  # docker-compose builds Dockerfile.development and live-mounts the source;
  # in kubernetes you deploy a built image instead.
  image: registry.gitlab.com/pantacor/pantahub-base
  tag: develop
  service:
    type: ClusterIP
  # per-service env overrides (compose "environment:" block)
  env:
    # the image entrypoint sources $ENVFILE (baked env.default by default),
    # which would clobber the ConfigMap env — neutralize it
    ENVFILE: "/dev/null"
    PANTAHUB_STORAGE_DRIVER: "local"
    PANTAHUB_S3PATH: "/local-s3"
    PANTAHUB_WEBHOOKS_PROXY_TRUST_INSECURE: "true"
  persistence:
    # /local-s3 object storage when PANTAHUB_STORAGE_DRIVER=local
    size: 20Gi
  resources: {}

gc:
  enabled: true
  image: registry.gitlab.com/pantacor/pantahub-gc
  tag: develop
  env:
    PANTAHUB_GC_UNCLAIMED_EXPIRY: "P5D"
    PANTAHUB_GC_GARBAGE_EXPIRY: "P2D"
    PANTAHUB_HOST: "base"
    PANTAHUB_PORT: "12365"
    PANTAHUB_GC_API: "http://gc:2000"
  resources: {}

pvr:
  enabled: true
  image: registry.gitlab.com/pantacor/pantahub-pvr
  tag: latest
  service:
    type: ClusterIP
  env:
    PANTAHUB_API_HOST: "http://base:12365"
  resources: {}

www:
  enabled: true
  image: registry.gitlab.com/pantacor/pantahub-www
  tag: devel
  service:
    type: ClusterIP
  # REACT_APP_* set the www server consumes (from hub/ui's .env / env.www,
  # minus billing/stripe which are not part of the open-source stack): the Go
  # server injects every REACT_APP_* var into window.env at runtime and
  # derives its CSP from the URL ones. The three base/www/pvr URLs are
  # rewired automatically when ingress.domain is set.
  env:
    REACT_APP_TITLE: "PantacorHub DevBench"
    # client-facing interfaces (defaults assume the port-forward workflow)
    REACT_APP_API_URL: "http://localhost:12365"
    REACT_APP_WWW_URL: "http://localhost:3000"
    REACT_APP_PVR_URL: "http://localhost:12367"
    REACT_APP_BLOG_URL: ""
    REACT_APP_IMAGES_CI_CHANNEL: "release-candidate"
    REACT_APP_SUPPORTED_DEVICES_URL: "https://pantavisor-ci.s3.amazonaws.com/pv-initial-devices/stable.json"
    REACT_APP_REFRESH_RATE: "6000"
    REACT_APP_CAPTCHA_SITE_KEY: ""
    REACT_APP_HOSTED_LOGO: ""
    REACT_APP_MIXPANEL_ID: ""
    REACT_APP_MAIN_LOGO: ""
    REACT_APP_GA_KEY: ""
    REACT_APP_GTM_ID: ""
    REACT_APP_SOCIAL_OAUTH_GOOGLE_DISABLE: "false"
    REACT_APP_SOCIAL_OAUTH_GITLAB_DISABLE: "false"
    REACT_APP_SOCIAL_OAUTH_GITHUB_DISABLE: "false"
    REACT_APP_SOCIAL_OAUTH_DISABLE: "false"
    REACT_APP_SERVICE_WORKER: "false"
    REACT_APP_REDUX_DEBUG: "true"
    SKIP_PREFLIGHT_CHECK: "true"
    REACT_APP_DEBUG: "true"
  resources: {}

phs:
  enabled: true
  image: registry.gitlab.com/pantacor/pantahub-streams-devicesummary
  tag: X64-develop
  env:
    JAVA_OPTS: "-XX:-UseContainerSupport"
    PANTAHUB_KAFKA_HOSTPORT: "kafka:9092"
    PANTAHUB_SCHEMAREGISTRY_URL: "http://kafka-schema-registry:8081"
    PANTAHUB_KAFKA_TOPIC_FLUENTD: "fluentd-api"
    PANTAHUB_KAFKA_STREAMS_ID: "ph-device-summary"
    PANTAHUB_KAFKA_TOPIC_SUMMARY: "ph-device-summary-short"
    PANTAHUB_KAFKA_TOPIC_PREFIX: "pantabase1.pantabase-serv"
  resources: {}

webhooks:
  enabled: true
  image: registry.gitlab.com/pantacor/services/webhooks
  tag: main
  service:
    type: ClusterIP
  env:
    PH_WEBHOOKS_HTTP_ADDR: ":12380"
    # PH_WEBHOOKS_MONGO_URI is derived from mongo.webhooksUser and this DB
    # name; set it here explicitly only to point at an external mongo
    PH_WEBHOOKS_MONGO_DB: "pantabase-webhooks"
    PH_WEBHOOKS_KAFKA_BROKERS: "kafka:9092"
    PH_WEBHOOKS_KAFKA_GROUP: "ph-webhooks-v1"
    PH_WEBHOOKS_KAFKA_TOPIC_DEVICES: "pantabasemgo.pantabase-serv.pantahub_devices"
    PH_WEBHOOKS_KAFKA_TOPIC_STEPS: "pantabasemgo.pantabase-serv.pantahub_steps"
    PH_WEBHOOKS_PROXY_SECRET: ""
    PH_WEBHOOKS_PROXY_SECRET_V2: ""
    PH_WEBHOOKS_PROXY_TRUST_INSECURE: "true"
    PH_WEBHOOKS_ALLOW_PRIVATE_TARGETS: "false"
    PH_WEBHOOKS_ALLOW_HTTP_TARGETS: "false"
    PH_WEBHOOKS_LOG_LEVEL: "info"
  resources: {}

fluentd:
  enabled: true
  image: registry.gitlab.com/pantacor/cloud/fluentd-ph
  tag: master
  env:
    FLUENT_ELASTICSEARCH_HOST: "elasticsearch"
    FLUENT_ELASTICSEARCH_PORT: "9200"
  # bounded by default: an unbounded fluentd buffer OOM-looped production
  # (ce019, 2026-07); base treats fluentd as a hard startup dependency.
  resources:
    requests:
      memory: 400Mi
    limits:
      memory: 1536Mi

elasticsearch:
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch
  tag: 8.17.2
  # privileged initContainer that sets vm.max_map_count=262144 on the node
  sysctlInit:
    enabled: true
  persistence:
    size: 10Gi
  resources:
    limits:
      memory: 1Gi

kibana:
  # compose keeps kibana behind the "logs" profile; off by default here too
  enabled: false
  image: docker.elastic.co/kibana/kibana
  tag: 8.17.2
  service:
    type: ClusterIP
  # xpack encryption keys rendered into kibana.yml (32+ chars each, e.g.
  # `openssl rand -hex 16`). Defaults are the well-known dev keys —
  # REPLACE THEM for anything but a throwaway dev cluster.
  encryptionKeys:
    encryptedSavedObjects: "706b827ddbcaa0ccc8330896cab5829d"
    reporting: "9bc1ecfc178f6f4e5534b199d43e9f58"
    security: "1d06883188ba212a0b4701219651426e"
  resources: {}

mongo:
  enabled: true
  image: mongo
  tag: 4.4.3
  # rs0 member names/ports are hardcoded in mongo-cluster-entrypoint;
  # keep them in sync if you change anything here.
  members:
    - name: mongo
      port: 27017
      primary: true
    - name: mongo2
      port: 30002
      primary: false
    - name: mongo3
      port: 30003
      primary: false
  # All mongo users are created by mongo-cluster-entrypoint on first
  # bring-up and rendered into the kafka-connect connector configs, so each
  # credential lives in exactly one place:
  #   root user  -> mongo.env MONGO_INITDB_ROOT_USERNAME / _PASSWORD
  #   app user   -> mongo.appUser (database env.MONGO_DB; injected into the
  #                 shared env as MONGO_USER / MONGO_PASS)
  #   webhooks   -> mongo.webhooksUser (database
  #                 webhooks.env.PH_WEBHOOKS_MONGO_DB; rendered into
  #                 PH_WEBHOOKS_MONGO_URI)
  #   connectors -> mongo.connectUsers below
  # Passwords end up inside mongodb:// connection URIs: stick to URL-safe
  # characters (letters, digits, - _ . ~). Defaults are the well-known dev
  # credentials — REPLACE THEM for anything but a throwaway dev cluster.
  env:
    MONGO_INITDB_ROOT_USERNAME: "admin"
    MONGO_INITDB_ROOT_PASSWORD: "admin"
    MONGO_RS: "rs0"
  appUser:
    username: "user"
    password: "pass"
  webhooksUser:
    username: "webhooks"
    password: "pass"
  connectUsers:
    # debezium source connector (pantabase.json), reads the oplog via admin
    source:
      username: "phskafkaconnectsource"
      password: "pass"
    # device-summary sink connectors, write to pantabase_devicesummary
    sink:
      username: "phskafkaconnectsink"
      password: "pass"
  # replica-set keyfile entries (Secret "pantahub-mongokey", mongod YAML
  # keyfile format; list more than one key during rotation). Generate with
  # `openssl rand -base64 32`. The default is the well-known dev key —
  # REPLACE IT for anything but a throwaway dev cluster.
  keyfileKeys:
    - "62PQfye4Pdg89I45jcB/GxHNcoaGgLXP1ZOSh4QLttM="
  persistence:
    size: 10Gi
  resources: {}

zookeeper:
  enabled: true
  image: confluentinc/cp-zookeeper
  tag: 5.4.3
  resources: {}

kafka:
  enabled: true
  image: confluentinc/cp-kafka
  tag: 5.4.3
  persistence:
    size: 10Gi
  resources: {}

kafkaSchemaRegistry:
  enabled: true
  image: confluentinc/cp-schema-registry
  tag: 5.4.3
  resources: {}

kafkaConnect:
  enabled: true
  image: registry.gitlab.com/pantacor/kafka-connect-with-plugins
  tag: 5.4.3
  resources: {}

kafkaRest:
  enabled: true
  image: confluentinc/cp-kafka-rest
  tag: 5.4.3
  resources: {}

localstack:
  enabled: true
  image: localstack/localstack
  tag: 1.3.0
  persistence:
    # mounts a PVC on /var/lib/localstack and sets PERSISTENCE=1. NOTE:
    # snapshot persistence is a LocalStack PRO feature — the default community
    # image ignores it and S3 state is lost on restart either way (use a Pro
    # image, or a fork like gresau/localstack-persist, if you need it).
    # Disabled: emptyDir (compose used a host bind mount).
    enabled: false
    size: 5Gi
  resources: {}

cronjobs:
  # native k8s CronJobs replacing the compose "cronjobs" crond container
  enabled: true
  image: curlimages/curl
  tag: 8.11.1
  publicDevicesSchedule: "*/15 * * * *"
  publicStepsSchedule: "*/15 * * * *"
  gcSchedule: "57 * * * *"

ingress:
  # Public, client-facing entry points (replaces the compose nginx proxy).
  # Setting `domain` serves:
  #   api.<domain> -> base (device/client API)
  #   hub.<domain> -> www  (web UI)
  #   pvr.<domain> -> pvr
  # Whenever the ingress is enabled, PANTAHUB_HOST/PH_AUTH/REACT_APP_* are
  # rewired to the served hosts (from `domain`, or the fallbacks below).
  enabled: false
  # "" uses the cluster's default IngressClass (traefik on stock k3s);
  # set explicitly (e.g. "nginx") when running several controllers
  className: ""
  annotations: {}
  domain: ""
  # fallback hosts when domain is unset (local clusters; combine with
  # tls.enabled=false + letsencrypt.enabled=false — LE cannot issue for
  # .localhost names)
  apiHost: api.localhost
  hubHost: hub.localhost
  pvrHost: pvr.localhost
  tls:
    enabled: true
    # cert-manager stores the issued certificate here
    secretName: pantahub-tls
  letsencrypt:
    # annotate the ingress for cert-manager; requires cert-manager installed
    enabled: true
    issuer: letsencrypt-prod
    # create the ClusterIssuer too (set an email for the ACME account)
    createIssuer: true
    email: ""
    server: https://acme-v02.api.letsencrypt.org/directory
